name: Check

# The suite against itself and the schema, on every pull request and push to main (tools/check.mjs).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    name: Suite and schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run check
