name: Check

# The suite against itself and the schema, on every pull request and push to main (tools/check.mjs),
# the reference reader of js/ against the suite (npm test), on the runner's Node and on Node 18,
# and, on a pull request, a sign-off on every commit (CONTRIBUTING.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    name: Suite and schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run check
      # The reference reader in js/ against the whole suite, its CLI and its types.
      - run: npm test

  reader-node-18:
    name: Reader on Node 18
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The oldest Node the package kpin supports.
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: npm ci
      - run: npm test

  sign-off:
    name: Signed off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit of the pull request carries a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::$(git show -s --format='%h %s' "$commit") has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing
